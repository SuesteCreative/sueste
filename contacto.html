<!DOCTYPE html>
<html lang="pt-PT" class="smooth-scroll">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Sueste Creative Agency</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" href="images/fav-icon.png">
</head>

<body>
    <div class="noise-overlay"></div>

    <header class="site-header fixed-header glass-header">
        <div class="container header-inner">
            <a href="index.html" class="brand-link"><img src="images/logo-white-hor.png" alt="Sueste"
                    class="brand-logo"></a>
            <nav class="main-nav desktop-only">
                <a href="servicos.html" class="nav-link">Serviços</a>
                <a href="portfolio.html" class="nav-link">Portfólio</a>
                <a href="sobre.html" class="nav-link">Sobre</a>
            </nav>
            <div class="header-actions">
                <a href="contacto.html" class="btn btn-primary desktop-only">Pedir Proposta</a>
                <button class="mobile-toggle"><span></span><span></span></button>
            </div>
        </div>
    </header>

    <main class="page-content">
        <section class="container small-container">
            <div class="section-header align-center">
                <span class="label">Fale Connosco</span>
                <h1 class="page-title">Vamos criar impacto?</h1>
                <p class="page-lead">Preencha o formulário ou envie-nos um email direto. Respondemos em 24h.</p>
            </div>

            <div class="contact-grid glass">
                <div class="contact-sidebar">
                    <h3>Informações</h3>
                    <div class="contact-item">
                        <i data-lucide="mail"></i>
                        <div>
                            <span class="sub-label">Email</span>
                            <a href="mailto:hello@sueste.pt">hello@sueste.pt</a>
                        </div>
                    </div>
                    <div class="contact-item">
                        <i data-lucide="phone"></i>
                        <div>
                            <span class="sub-label">Telemóvel</span>
                            <a href="tel:+351910000000">+351 910 000 000</a>
                        </div>
                    </div>
                    <div class="contact-item">
                        <i data-lucide="map-pin"></i>
                        <div>
                            <span class="sub-label">Localização</span>
                            <span>Algarve, Portugal</span>
                        </div>
                    </div>
                </div>

                <form class="contact-form-classic" action="#" method="POST">
                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" name="name" required placeholder="O seu nome">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" required placeholder="seu@email.com">
                    </div>
                    <div class="form-group">
                        <label>Assunto</label>
                        <select name="subject">
                            <option value="orcamento">Pedir Orçamento</option>
                            <option value="duvida">Informação Geral</option>
                            <option value="parceria">Parceria</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Mensagem</label>
                        <textarea name="message" rows="5" required placeholder="Como podemos ajudar?"></textarea>
                    </div>
                    <button type="submit" class="btn btn-full">Enviar Mensagem <i data-lucide="send"
                            size="16"></i></button>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer section">
        <div class="container center-text">
            <p class="copyright">© 2026 Sueste Creative Agency.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
